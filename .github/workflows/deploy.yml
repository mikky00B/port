name: CI/CD - clevermike.studio

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test clevermike.studio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build app
        run: npm run build

  deploy:
    name: Deploy clevermike.studio
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Contabo
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e

            cd /opt/apps/mike/port

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci

            echo "Building clevermike.studio..."
            npm run build

            echo "Restarting clevermike..."
            sudo -n /usr/bin/systemctl restart clevermike

            echo "Checking clevermike service..."
            sudo -n /usr/bin/systemctl is-active --quiet clevermike

            echo "Waiting for app..."
            for i in 1 2 3 4 5 6; do
              if curl -fsS http://127.0.0.1:8008/ > /dev/null; then
                echo "clevermike.studio is healthy"
                exit 0
              fi
              echo "Waiting for app (attempt $i/6)..."
              sleep 5
            done

            echo "clevermike.studio did not become healthy after restart"
            sudo -n /usr/bin/journalctl -u clevermike -n 50 --no-pager
            exit 1
